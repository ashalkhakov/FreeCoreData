# FreeCoreData's AppImage: what it carries and starts. The image is gnustep-release-actions'
# appimage (the launcher, the runtime, the fonts), the same as every app's;
# see its appimage.sh for each name.
IMAGE=FreeCoreData
NAME=FreeCoreData
# The CDLauncher chooser, Model Builder and the sample apps.
APPS="CDLauncher ModelBuilder Staffbook EmployeeDirectory Bulletin"
DEFAULT=CDLauncher
#   <image> modelbuilder|staffbook|directory|bulletin ...   (or a symlink so named)
ROUTES="modelbuilder=ModelBuilder staffbook=Staffbook directory,employeedirectory=EmployeeDirectory bulletin=Bulletin launcher,cdlauncher=CDLauncher"
# A model's path: Model Builder opens it, or says why not.
WITH_FILE=ModelBuilder
ENTRIES="Scripts/appimage/freecoredata.desktop=ModelBuilder/ModelBuilder.png"
# The SQL stores, loaded by name (-StoreType PostgreSQL, MySQL).
LOADED="libCD*Store.so"
# Each launch mode started on a clean Ubuntu, and its interface loaded.
SMOKE_SCRIPT=Tests/appimage-smoke.sh
