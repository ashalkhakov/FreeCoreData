# The stores an app opts into, in archives of their own (gnustep-release-actions'
# scripts/library-archive.sh): each links its database's client library, which
# an app that uses SQLite alone should not carry. An app asks for them in its
# pins.env: FREECOREDATA_PARTS="postgresql mysql". CDSQLStore, what both are
# built on, goes with each.
PARTS="postgresql mysql"
PART_postgresql="CDPostgreSQLStore CDSQLStore"
PART_mysql="CDMySQLStore CDSQLStore"
