# FreeCoreData's Windows installer: what it carries and starts. The installer
# is gnustep-release-actions' msi (the runtime, WinUXTheme, the launcher),
# the same as every app's; see its msi.sh for each name.
NAME=FreeCoreData
# The CDLauncher chooser, Model Builder and the sample apps, as the AppImage.
APPS="CDLauncher ModelBuilder Staffbook EmployeeDirectory Bulletin"
DEFAULT=CDLauncher
ICON=ModelBuilder/ModelBuilder.png
SUMMARY="Core Data on GNUstep: Model Builder and the sample apps"
# No self-test: the installed launcher still up after 25 seconds, its nibs
# loaded (as the AppImage's smoke test).
SMOKE_STAYS_UP=25
