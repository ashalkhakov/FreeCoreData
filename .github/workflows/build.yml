name: Build

# FreeCoreData, built, tested and installed the familiar way (make, make
# check, make install; Makefile.apple on macOS) by gnustep-release-actions'
# workflows, the same as every repository's. Every push builds and tests it
# and uploads what it installs: on Linux the framework, momc and the SQL
# stores as an archive for what builds on them, and the AppImage (the
# CDLauncher chooser, Model Builder and the sample apps); on macOS Model
# Builder. A v* tag (or a run started by hand with one) also releases them:
# the archives and the AppImage with its update information, Model Builder
# signed and notarized with its Sparkle appcast, attached to the tag's
# release (a pre-release when the tag has a '-'). What it builds on is in
# .github/pins.env.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and release (empty: this branch, as artifacts)'
        required: false
        default: ''

# Pushes only: a push to a branch already shows its checks on the branch's
# pull request. A newer push supersedes the run before it; a release is
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  linux:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/linux.yml@v1
    with:
      tag: ${{ inputs.tag }}
      library: true
      extra-packages: libsqlite3-dev libpq-dev libmariadb-dev
      databases: postgres mysql mariadb

  windows:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/windows.yml@windows-wine
    with:
      tag: ${{ inputs.tag }}
      library: true
      extra-packages: sqlite3 postgresql libmariadbclient

  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: ModelBuilder=ModelBuilder
    secrets: inherit
