name: Release

# Model Builder for macOS (signed, notarized, updated by Sparkle) and the
# FreeCoreData AppImage for Linux (the CDLauncher chooser, Model Builder and
# the sample apps; it updates itself), by gnustep-release-actions' release
# workflows, the same as every app's. What is FreeCoreData's own is in
# .github/release/ (build, test, package); the commits it builds on in
# .github/pins.env.
#
# A v* tag builds both and attaches them to its release (a pre-release when
# the tag has a '-'). Run by hand with a tag, it builds that tag; with none,
# this branch, as artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/macos-release.yml@v1
    with:
      tag: ${{ inputs.tag }}
      apps: ModelBuilder=ModelBuilder
    secrets: inherit

  appimage:
    uses: ashalkhakov/gnustep-release-actions/.github/workflows/appimage-release.yml@appimage-shared
    with:
      tag: ${{ inputs.tag }}
      extra-packages: libsqlite3-dev
