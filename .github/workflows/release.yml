name: Release

# Ported from XFormsKit's release workflow. A v* tag builds both packages and
# attaches them to that release; run by hand with a tag, it builds that tag
# and attaches to its release; with none, it builds the branch, as artifacts
# only. A tag with a - in it (v0.2.0-rc1) makes a pre-release.
#
# Two outputs, one per platform: a FreeCoreData AppImage for Linux (the
# CDLauncher chooser, Model Builder and the sample apps in one image) and a
# signed, notarized ModelBuilder app for macOS. Each updates itself from the
# newest release: the app through Sparkle (appcast.xml), the AppImage through
# its update information (the .zsync beside it).
#
# Signing, notarizing, the appcast, the AppImage tools and the GNUstep stack
# are gnustep-release-actions', the same in every app's release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The GNUstep fixes come from the shared gnustep-patches repository, at
  # the commit ci.yml pins: the release is built from what CI tested.
  GNUSTEP_PATCHES_REF: 610d60bfdc18b5d36587e799e1b26c460a608d9d
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  ############################ Linux AppImage ############################
  appimage:
    name: Linux AppImage
    # Built on the oldest Ubuntu LTS still in support, not ubuntu-latest:
    # an AppImage carries its own libraries but not glibc, so it runs only
    # on a system at least as new as the one it was linked on. Built on a
    # current runner it fails to start on that LTS, which is what
    # appimage.github.io tests with (PR 9036). Raise this only when that
    # release leaves support.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # The stack's settings (PREFIX, COMPONENTS, the toolchain) are
    # gnustep-release-actions/gnustep-stack's.
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/gnustep-patches
          ref: ${{ env.GNUSTEP_PATCHES_REF }}
          path: gnustep-patches

      - name: Version
        run: |
          if [ -n "$TAG" ]; then
            echo "APP_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # The patched stack, cached by its recipe: Foundation, gui and back
      # for the apps, and the Eau theme they look as with (AppRun selects
      # it). Beyond the stack's packages, the framework's own: the SQLite
      # store links libsqlite3.
      - name: GNUstep
        uses: ashalkhakov/gnustep-release-actions/gnustep-stack@v1
        with:
          patches: ${{ github.workspace }}/gnustep-patches
          extra-packages: libsqlite3-dev

      - name: linuxdeploy and the AppImage runtime
        uses: ashalkhakov/gnustep-release-actions/appimage-tools@v1

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Assemble AppDir
        run: GNUSTEP_PREFIX="$PREFIX" ./Scripts/prepare-appdir.sh

      # A release's image updates itself from the newest release (through
      # AppImageUpdate, Gear Lever and the like), by the .zsync attached
      # beside it; a pre-release's does not.
      - name: Update information
        uses: ashalkhakov/gnustep-release-actions/appimage-update-info@v1
        with:
          tag: ${{ env.TAG }}
          zsync: FreeCoreData-*x86_64.AppImage.zsync

      - name: Package the AppImage
        run: GNUSTEP_PREFIX="$PREFIX" ./Scripts/package-appimage.sh

      # Proof it starts. The apps are GUI-only, so each launch mode runs
      # against a virtual display: bare (the launcher), a model to open
      # (Model Builder), and each sample by its keyword; a bundle that
      # cannot find its framework, its backend or its nibs dies here
      # rather than for whoever downloads it.
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get -q -y install xvfb
          image=$(ls FreeCoreData-*.AppImage)
          chmod +x "$image"
          for mode in "" Tests/MomcFixture.xcdatamodeld staffbook employeedirectory bulletin; do            log="$RUNNER_TEMP/smoke.log"
            timeout 90 xvfb-run -a ./"$image" $mode > "$log" 2>&1 &
            pid=$!
            sleep 25
            if kill -0 $pid 2>/dev/null; then
              echo "${mode:-launcher}: up after 25s"
              kill $pid 2>/dev/null || true
              wait $pid 2>/dev/null || true
            else
              wait $pid; status=$?
              cat "$log"
              echo "::error::AppImage (${mode:-launcher}) exited on its own with status $status"
              exit 1
            fi
            # Staying up is not enough: an app whose nib failed to load stays
            # up too, as an icon with no menu and no window. GNUstep reports
            # that on stderr, so it is read back from there.
            if grep -E "Failed to load Xib|could not load nib|failed to load MainMenu" "$log"; then
              echo "::error::AppImage (${mode:-launcher}) started without its interface"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FreeCoreData-${{ env.APP_VERSION }}
          path: |
            ${{ github.workspace }}/source/FreeCoreData-*.AppImage
            ${{ github.workspace }}/source/FreeCoreData-*.AppImage.zsync
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ github.workspace }}/source/FreeCoreData-*.AppImage
            ${{ github.workspace }}/source/FreeCoreData-*.AppImage.zsync

  ############################ macOS ############################
  macos:
    name: macOS (signed)
    runs-on: macos-15
    timeout-minutes: 45
    # The signing and notarisation secrets live in this environment, and an
    # environment's secrets are only readable by a job that names it: without
    # this line every one of them resolves to the empty string and the job
    # ships an unsigned build, saying so and passing.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Version
        run: |
          if [ -n "$TAG" ]; then
            echo "APP_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      # A generic destination builds every architecture the target lists --
      # arm64 and x86_64 -- where 'platform=macOS' would build only the
      # runner's own, and the runners are Apple silicon: Intel Macs would get
      # an app that does not launch.
      #
      # ModelBuilder links Cocoa and the system CoreData; the one framework
      # it embeds is Sparkle, its updater (a Swift package Xcode fetches).
      - name: Build
        run: |
          xcodebuild -project ModelBuilder/ModelBuilder.xcodeproj -scheme ModelBuilder \
            -destination 'generic/platform=macOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/ModelBuilder.app"
          lipo "$app/Contents/MacOS/ModelBuilder" -verify_arch arm64 x86_64
          test -d "$app/Contents/Frameworks/Sparkle.framework" \
            || { echo "::error::ModelBuilder.app does not embed Sparkle.framework"; exit 1; }
          echo "APP=$app" >> "$GITHUB_ENV"

      # Each step skips itself, saying so, when its secrets are absent (a
      # fork, a dry run): the build is then unsigned, and named so.
      - name: Sign
        id: sign
        uses: ashalkhakov/gnustep-release-actions/macos-sign@v1
        with:
          app: ${{ env.APP }}
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.MACOS_SIGN_IDENTITY }}

      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/macos-notarize@v1
        with:
          app: ${{ env.APP }}
          apple-id: ${{ secrets.NOTARY_APPLE_ID }}
          team-id: ${{ secrets.NOTARY_TEAM_ID }}
          password: ${{ secrets.NOTARY_PASSWORD }}

      - name: Package
        run: |
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          ditto -c -k --keepParent "$APP" "ModelBuilder-macOS-${APP_VERSION}${suffix}.zip"

      # The appcast the app's Sparkle reads (SUFeedURL: the newest release's
      # appcast.xml), signed with the key whose public half is SUPublicEDKey;
      # for a release only.
      - name: Appcast
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/sparkle-appcast@v1
        with:
          archive: ${{ github.workspace }}/ModelBuilder-macOS-${{ env.APP_VERSION }}.zip
          output: ${{ github.workspace }}/appcast.xml
          tag: ${{ env.TAG }}
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: ModelBuilder-macOS-${{ env.APP_VERSION }}
          path: |
            ${{ github.workspace }}/ModelBuilder-macOS-*.zip
            ${{ github.workspace }}/appcast.xml

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ github.workspace }}/ModelBuilder-macOS-*.zip
            ${{ github.workspace }}/appcast.xml
