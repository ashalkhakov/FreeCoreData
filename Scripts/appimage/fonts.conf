<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig for the bundled fonts, plus whatever the host has.

     A form's own CSS names the fonts its author had, and the host tree is
     laid out with whatever the machine can find. Shipping a set means a form
     looks the same on a machine that has none of them installed. -->
<fontconfig>
  <dir prefix="relative">../share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>~/.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
